<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#08080a" />
<title>Cozinha — levantamento em curso</title>
<style>
  :root {
    --tinta: #d8d0c0;
    --tinta-fraca: #8d8574;
    --fundo: #08080a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fundo); }
  canvas { display: block; }

  /* Vinheta: escurece as bordas por cima do render. Uma sala pequena com
     uma fonte de luz dominante já tem cantos escuros; a vinheta apenas
     impede que o campo de visão periférico compita com o centro. */
  #vinheta {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%);
  }

  /* A mira é fixa — reagir ao hover virou trabalho da aura no próprio
     objeto (ver main.js), não mais do cursor. */
  #mira {
    position: fixed; top: 50%; left: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: var(--tinta); opacity: .32;
    pointer-events: none; z-index: 3;
  }

  /* Fade da transição entre salas. Opacidade é controlada por JS,
     quadro a quadro (main.js) — não por transition CSS — pra nunca
     dessincronizar do momento exato da troca de cena. */
  #transicao {
    position: fixed; inset: 0; z-index: 5;
    background: var(--fundo); opacity: 0; pointer-events: none;
  }

  /* Notificação de campo: um painel de levantamento, não uma legenda
     permanente. Toda mensagem entra, permanece legível por 5s e some. */
  #hud {
    position: fixed; left: 24px; bottom: 24px; width: min(390px, calc(100vw - 48px));
    box-sizing: border-box; padding: 14px 16px 15px;
    border: 1px solid rgba(216, 208, 192, .42); border-radius: 3px;
    background: rgba(8, 8, 10, .86); backdrop-filter: blur(6px);
    box-shadow: 0 10px 32px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255,255,255,.025);
    font-family: "Courier New", ui-monospace, monospace;
    color: var(--tinta); pointer-events: none; z-index: 3;
    opacity: 0; transform: translateY(8px); visibility: hidden;
    transition: opacity .28s ease, transform .28s ease, visibility 0s linear .28s;
  }
  #hud.visivel {
    opacity: 1; transform: none; visibility: visible;
    transition: opacity .28s ease, transform .28s ease;
  }
  #hud::before {
    content: "OBJETO — NOTIF."; display: block; margin-bottom: 8px;
    font-size: 10px; letter-spacing: .18em; color: var(--tinta-fraca);
  }
  #hud-titulo {
    display: block; margin: 0 0 5px; font-size: 12px;
    line-height: 1.35; letter-spacing: .12em; color: var(--tinta);
  }
  #hud-texto {
    display: block; margin: 0; font-size: 14px;
    line-height: 1.55; letter-spacing: .01em; color: var(--tinta);
  }
  @media (max-width: 520px) {
    #hud { left: 16px; bottom: 16px; width: calc(100vw - 32px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #hud, #hud.visivel { transition: none; }
  }

  #capa {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--fundo); color: var(--tinta);
    font-family: "Courier New", ui-monospace, monospace; text-align: center;
    cursor: pointer; transition: opacity .45s ease;
  }
  #capa.oculto { opacity: 0; pointer-events: none; }
  #capa .marca {
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--tinta-fraca);
  }
  #capa .chamada { font-size: 17px; }
  #capa .controles {
    font-size: 12px; line-height: 2; color: var(--tinta-fraca);
    border-top: 1px solid #221f1b; padding-top: 16px; max-width: 42ch;
  }
  #capa kbd {
    font: inherit; border: 1px solid #322e28; border-radius: 2px;
    padding: 1px 5px; color: var(--tinta);
  }

  /* Encerramento (relatório): tela cheia por cima do 3D, no mesmo
     registro visual do terminal 2D (ficha institucional, papel,
     carimbo). Depois de aparecer não existe "voltar pro jogo" — é o
     mesmo comportamento terminal que renderRelatorio()/renderTerminalFinal()
     já têm no 2D. As variáveis de cor ficam soltas aqui (não em :root)
     de propósito: são só desse cartão de papel, nunca do resto da UI
     escura do jogo. */
  #relatorio-overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    background: #d8d9d3;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 2px, #00000004 2px 3px),
      repeating-linear-gradient(90deg, transparent 0 2px, #00000003 2px 3px);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  #relatorio-overlay.visivel {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .5s ease;
  }
  #relatorio-overlay .ficha {
    --ink: #24261f; --ink-muted: #5b5d52; --panel: #c9cac2;
    --panel-edge: #b7b8ae; --line: #a9aa9f; --stamp-faint: #7a2e2e88;
    max-width: 520px; width: 100%;
    background: var(--panel); border: 1px solid var(--panel-edge);
    position: relative; padding: 46px 34px 30px; margin-top: 18px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.5);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    color: var(--ink);
    transition: opacity .3s ease, transform .3s ease;
  }
  #relatorio-overlay .ficha.ficha-entrando { opacity: 0; transform: translateY(8px); }
  #relatorio-overlay .protocolo {
    position: absolute; top: -23px; left: 22px; width: 196px;
    padding: 6px 12px 5px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--panel-edge); border-bottom: none;
    clip-path: polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
    font-family: "Courier New", ui-monospace, monospace; font-size: 9.5px;
    letter-spacing: .02em; color: var(--ink-muted);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  #relatorio-overlay h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 14px;
  }
  #relatorio-overlay p.digitando {
    font-size: 15px; line-height: 1.65; margin: 0 0 8px; white-space: pre-line;
    min-height: 1.65em;
  }
  #relatorio-overlay .ficha-dados {
    display: flex; flex-direction: column; gap: 10px; margin: 4px 0 20px;
    padding: 14px 16px; border: 1px solid var(--line); background: #d8d9d3;
  }
  #relatorio-overlay .ficha-dados > div { display: flex; justify-content: space-between; gap: 12px; }
  #relatorio-overlay .rotulo-dado {
    font-family: "Courier New", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted);
  }
  #relatorio-overlay .valor-dado { font-size: 15px; font-weight: 700; }
  #relatorio-overlay .continuar-catalogacao {
    all: unset; cursor: pointer; display: inline-block; margin-top: 18px;
    font-family: "Courier New", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .06em; color: var(--ink-muted);
    border: 1px solid var(--line); padding: 8px 14px;
    transition: color .15s ease, border-color .15s ease;
  }
  #relatorio-overlay .continuar-catalogacao:hover { color: var(--ink); border-color: #8a8c81; }
  #relatorio-overlay .selo {
    position: absolute; bottom: 20px; right: 26px;
    border: 1.5px solid var(--stamp-faint); color: var(--stamp-faint);
    font-family: "Courier New", ui-monospace, monospace; font-size: 10px;
    letter-spacing: .08em; padding: 5px 9px; transform: rotate(-4deg);
    text-transform: uppercase; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    #relatorio-overlay, #relatorio-overlay .ficha { transition: none; }
  }
</style>

<!--
  Sem bundler de propósito: subir um servidor estático na raiz do projeto
  e abrir este arquivo já basta. O importmap resolve "three" pro CDN em
  tempo de carregamento.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <main id="capa">
    <p class="marca">Levantamento predial — unidade 04</p>
    <p class="chamada">Clique para entrar na Cozinha</p>
    <p class="controles">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> andar ·
      <kbd>Shift</kbd> andar devagar<br>
      mouse olhar · clique examinar · <kbd>Esc</kbd> sair
    </p>
  </main>

  <div id="vinheta"></div>
  <div id="mira"></div>
  <aside id="hud" role="status" aria-live="polite" aria-atomic="true">
    <strong id="hud-titulo"></strong>
    <span id="hud-texto"></span>
  </aside>
  <div id="transicao"></div>
  <div id="relatorio-overlay" role="region" aria-label="Encerramento do levantamento" aria-hidden="true"></div>

  <script src="../../core/dados.js"></script>
  <script src="../../core/estado.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
