<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#08080a" />
<title>Cozinha — levantamento em curso</title>
<style>
  :root {
    --tinta: #d8d0c0;
    --tinta-fraca: #8d8574;
    --fundo: #08080a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fundo); }
  canvas { display: block; }

  /* Vinheta: escurece as bordas por cima do render. Uma sala pequena com
     uma fonte de luz dominante já tem cantos escuros; a vinheta apenas
     impede que o campo de visão periférico compita com o centro. */
  #vinheta {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%);
  }

  /* A mira reage à possibilidade de examinar — nunca ao que já foi
     examinado. É afordância, não progresso. */
  #mira {
    position: fixed; top: 50%; left: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: var(--tinta); opacity: .32;
    transition: opacity .18s ease, transform .18s ease, box-shadow .18s ease;
    pointer-events: none; z-index: 3;
  }
  #mira.ativa {
    opacity: .9; transform: scale(2.1);
    box-shadow: 0 0 0 1px rgba(216,208,192,.35);
  }

  #hud {
    position: fixed; left: 24px; bottom: 24px; max-width: 46ch;
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 14px; line-height: 1.6; letter-spacing: .01em;
    color: var(--tinta); text-shadow: 0 1px 4px #000, 0 0 18px rgba(0,0,0,.9);
    pointer-events: none; white-space: pre-wrap; z-index: 3;
  }
  #hud.surgindo { animation: surgir .32s ease-out; }
  @keyframes surgir { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  #capa {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--fundo); color: var(--tinta);
    font-family: "Courier New", ui-monospace, monospace; text-align: center;
    cursor: pointer; transition: opacity .45s ease;
  }
  #capa.oculto { opacity: 0; pointer-events: none; }
  #capa .marca {
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--tinta-fraca);
  }
  #capa .chamada { font-size: 17px; }
  #capa .controles {
    font-size: 12px; line-height: 2; color: var(--tinta-fraca);
    border-top: 1px solid #221f1b; padding-top: 16px; max-width: 42ch;
  }
  #capa kbd {
    font: inherit; border: 1px solid #322e28; border-radius: 2px;
    padding: 1px 5px; color: var(--tinta);
  }
</style>

<!--
  Sem bundler de propósito: subir um servidor estático na raiz do projeto
  e abrir este arquivo já basta. O importmap resolve "three" pro CDN em
  tempo de carregamento.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <main id="capa">
    <p class="marca">Levantamento predial — unidade 04</p>
    <p class="chamada">Clique para entrar na Cozinha</p>
    <p class="controles">
      <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> andar ·
      <kbd>Shift</kbd> andar devagar<br>
      mouse olhar · clique examinar · <kbd>Esc</kbd> sair
    </p>
  </main>

  <div id="vinheta"></div>
  <div id="mira"></div>
  <div id="hud" aria-live="polite"></div>

  <script src="../../core/dados.js"></script>
  <script src="../../core/estado.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
