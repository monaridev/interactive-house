<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#08080a" />
<title>Cozinha — levantamento em curso</title>
<style>
  :root {
    --tinta: #d8d0c0;
    --tinta-fraca: #8d8574;
    --fundo: #08080a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fundo); }
  canvas { display: block; }

  /* Vinheta: escurece as bordas por cima do render. Uma sala pequena com
     uma fonte de luz dominante já tem cantos escuros; a vinheta apenas
     impede que o campo de visão periférico compita com o centro. */
  #vinheta {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%);
  }

  /* A mira é fixa — reagir ao hover virou trabalho da aura no próprio
     objeto (ver main.js), não mais do cursor. */
  #mira {
    position: fixed; top: 50%; left: 50%; width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px; border-radius: 50%;
    background: var(--tinta); opacity: .32;
    pointer-events: none; z-index: 3;
  }

  /* Fade da transição entre salas. Opacidade é controlada por JS,
     quadro a quadro (main.js) — não por transition CSS — pra nunca
     dessincronizar do momento exato da troca de cena. */
  #transicao {
    position: fixed; inset: 0; z-index: 5;
    background: var(--fundo); opacity: 0; pointer-events: none;
  }

  /* Uma única camada barata atende sangue, frio e flash. As reações não
     adicionam passes ao composer e nunca capturam o clique do jogador. */
  #efeito-reacao {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    opacity: 0;
  }
  #efeito-reacao.efeito-sangue {
    background:
      radial-gradient(circle at 18% 22%, transparent 0 58%, rgba(91, 5, 8, .36) 78%, rgba(62, 0, 3, .6) 100%),
      linear-gradient(115deg, transparent 0 67%, rgba(113, 8, 11, .38) 68% 69%, transparent 70%);
    animation: efeito-sangue 1.4s ease-out forwards;
  }
  #efeito-reacao.efeito-frio {
    background: radial-gradient(ellipse at center, transparent 34%, rgba(86, 173, 205, .16) 67%, rgba(113, 202, 231, .38) 100%);
    animation: efeito-frio 1.5s ease-in-out forwards;
  }
  #efeito-reacao.efeito-flash {
    background: #eaf3ff;
    animation: efeito-flash .4s ease-out forwards;
  }
  canvas.tremor-leve { animation: tremor-leve .22s ease-out; }
  canvas.tremor-corte { animation: tremor-corte .3s ease-out; }
  @keyframes efeito-sangue { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes efeito-frio { 0%, 100% { opacity: 0; } 25% { opacity: .9; } 55% { opacity: .62; } }
  @keyframes efeito-flash { 0% { opacity: .92; } 28% { opacity: .52; } 100% { opacity: 0; } }
  @keyframes tremor-leve {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, -1px); }
  }
  @keyframes tremor-corte {
    0%, 100% { transform: translate(0); }
    18% { transform: translate(-4px, 2px); }
    38% { transform: translate(3px, -2px); }
    62% { transform: translate(-2px, -1px); }
    82% { transform: translate(1px, 1px); }
  }

  /* Notificação de campo: um painel de levantamento, não uma legenda
     permanente. Toda mensagem entra, permanece legível por 5s e some. */
  #hud {
    position: fixed; left: 24px; bottom: 24px; width: min(390px, calc(100vw - 48px));
    box-sizing: border-box; padding: 14px 16px 15px;
    border: 1px solid rgba(216, 208, 192, .42); border-radius: 3px;
    background: rgba(8, 8, 10, .86); backdrop-filter: blur(6px);
    box-shadow: 0 10px 32px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255,255,255,.025);
    font-family: "Courier New", ui-monospace, monospace;
    color: var(--tinta); pointer-events: none; z-index: 3;
    opacity: 0; transform: translateY(8px); visibility: hidden;
    transition: opacity .28s ease, transform .28s ease, visibility 0s linear .28s;
  }
  #hud.visivel {
    opacity: 1; transform: none; visibility: visible;
    transition: opacity .28s ease, transform .28s ease;
  }
  #hud::before {
    content: "OBJETO — NOTIF."; display: block; margin-bottom: 8px;
    font-size: 10px; letter-spacing: .18em; color: var(--tinta-fraca);
  }
  #hud-titulo {
    display: block; margin: 0 0 5px; font-size: 12px;
    line-height: 1.35; letter-spacing: .12em; color: var(--tinta);
  }
  #hud-texto {
    display: block; margin: 0; font-size: 14px;
    line-height: 1.55; letter-spacing: .01em; color: var(--tinta);
  }
  @media (max-width: 520px) {
    #hud { left: 16px; bottom: 16px; width: calc(100vw - 32px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #hud, #hud.visivel { transition: none; }
  }

  #capa {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--fundo); color: var(--tinta);
    font-family: "Courier New", ui-monospace, monospace; text-align: center;
    cursor: pointer; transition: opacity .45s ease;
  }
  #capa.oculto { opacity: 0; pointer-events: none; }
  #capa .marca {
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--tinta-fraca);
  }
  #capa .chamada { font-size: 17px; }
  #capa .controles {
    font-size: 12px; line-height: 2; color: var(--tinta-fraca);
    border-top: 1px solid #221f1b; padding-top: 16px; max-width: 42ch;
  }
  #capa kbd {
    font: inherit; border: 1px solid #322e28; border-radius: 2px;
    padding: 1px 5px; color: var(--tinta);
  }

  /* Encerramento (relatório): tela cheia por cima do 3D, no mesmo
     registro visual do terminal 2D (ficha institucional, papel,
     carimbo). Depois de aparecer não existe "voltar pro jogo" — é o
     mesmo comportamento terminal que renderRelatorio()/renderTerminalFinal()
     já têm no 2D. As variáveis de cor ficam soltas aqui (não em :root)
     de propósito: são só desse cartão de papel, nunca do resto da UI
     escura do jogo. */
  #relatorio-overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    background: #d8d9d3;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 2px, #00000004 2px 3px),
      repeating-linear-gradient(90deg, transparent 0 2px, #00000003 2px 3px);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .5s ease, visibility 0s linear .5s;
  }
  #relatorio-overlay.visivel {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .5s ease;
  }
  #relatorio-overlay .ficha {
    --ink: #24261f; --ink-muted: #5b5d52; --panel: #c9cac2;
    --panel-edge: #b7b8ae; --line: #a9aa9f; --stamp-faint: #7a2e2e88;
    max-width: 520px; width: 100%;
    background: var(--panel); border: 1px solid var(--panel-edge);
    position: relative; padding: 46px 34px 30px; margin-top: 18px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.5);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    color: var(--ink);
    transition: opacity .3s ease, transform .3s ease;
  }
  #relatorio-overlay .ficha.ficha-entrando { opacity: 0; transform: translateY(8px); }
  #relatorio-overlay .protocolo {
    position: absolute; top: -23px; left: 22px; width: 196px;
    padding: 6px 12px 5px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--panel-edge); border-bottom: none;
    clip-path: polygon(6% 0, 94% 0, 100% 100%, 0% 100%);
    font-family: "Courier New", ui-monospace, monospace; font-size: 9.5px;
    letter-spacing: .02em; color: var(--ink-muted);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  #relatorio-overlay h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 14px;
  }
  #relatorio-overlay p.digitando {
    font-size: 15px; line-height: 1.65; margin: 0 0 8px; white-space: pre-line;
    min-height: 1.65em;
  }
  #relatorio-overlay .ficha-dados {
    display: flex; flex-direction: column; gap: 10px; margin: 4px 0 20px;
    padding: 14px 16px; border: 1px solid var(--line); background: #d8d9d3;
  }
  #relatorio-overlay .ficha-dados > div { display: flex; justify-content: space-between; gap: 12px; }
  #relatorio-overlay .rotulo-dado {
    font-family: "Courier New", ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted);
  }
  #relatorio-overlay .valor-dado { font-size: 15px; font-weight: 700; }
  #relatorio-overlay .continuar-catalogacao {
    all: unset; cursor: pointer; display: inline-block; margin-top: 18px;
    font-family: "Courier New", ui-monospace, monospace; font-size: 11px;
    letter-spacing: .06em; color: var(--ink-muted);
    border: 1px solid var(--line); padding: 8px 14px;
    transition: color .15s ease, border-color .15s ease;
  }
  #relatorio-overlay .continuar-catalogacao:hover { color: var(--ink); border-color: #8a8c81; }
  #relatorio-overlay .selo {
    position: absolute; bottom: 20px; right: 26px;
    border: 1.5px solid var(--stamp-faint); color: var(--stamp-faint);
    font-family: "Courier New", ui-monospace, monospace; font-size: 10px;
    letter-spacing: .08em; padding: 5px 9px; transform: rotate(-4deg);
    text-transform: uppercase; pointer-events: none;
  }

  /* Fluxo principal novo: o papel ocupa só parte da tela e a Sala Final
     continua visível atrás. O estilo antigo acima permanece sendo usado
     por .modo-fallback no final apressado e em recuperação de erro. */
  #relatorio-overlay.modo-dossie {
    padding: clamp(14px, 3vh, 30px);
    background: rgba(4, 5, 5, .67);
    background-image: none;
    backdrop-filter: blur(2px) saturate(.72);
    transition: opacity .34s ease, visibility 0s linear .34s, background .48s ease;
  }
  #relatorio-overlay.modo-dossie.visivel { transition: opacity .34s ease, background .48s ease; }
  .dossie-papel {
    --papel: #c9bfa7; --papel-claro: #d4cbb5; --tinta-doc: #302b22;
    --tinta-fraca-doc: #655d4e; --linha-doc: #8b816d; --carimbo: #743c35;
    position: relative; box-sizing: border-box;
    width: min(680px, 84vw); height: min(68vh, 620px); min-height: 410px;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: clamp(26px, 4vh, 42px) clamp(24px, 4.5vw, 54px) 20px;
    overflow: hidden;
    color: var(--tinta-doc); background-color: var(--papel);
    background-image:
      radial-gradient(circle at 14% 18%, #7d6c4915 0 1px, transparent 2px),
      radial-gradient(circle at 83% 72%, #66563210 0 1px, transparent 2px),
      repeating-linear-gradient(0deg, transparent 0 3px, #2b241808 3px 4px),
      linear-gradient(105deg, #a99e8517, transparent 24%, #fff3 52%, transparent 78%);
    border: 1px solid #8e846f; box-shadow: 0 24px 80px rgba(0,0,0,.72), inset 0 0 50px #5a4b2d1d;
    font-family: "Courier New", ui-monospace, monospace;
    opacity: 0; transform: translateY(12px) scale(.985);
    transition: opacity .28s ease, transform .28s ease;
  }
  .dossie-papel.aberto { opacity: 1; transform: none; }
  .dossie-papel::before {
    content: ""; position: absolute; inset: 10px; pointer-events: none;
    border: 1px solid rgba(73,64,48,.25);
  }
  .dossie-papel.marca-frio { --papel: #c3c4b8; --papel-claro: #ced0c4; }
  .dossie-papel.marca-corte .dossie-corpo {
    background-image: linear-gradient(112deg, transparent 0 61%, #743c351d 61.2% 61.45%, transparent 61.7%);
  }
  .dossie-papel.marca-observacao .dossie-registro { position: relative; }
  .dossie-papel.marca-observacao .dossie-registro::after {
    content: ""; position: absolute; right: 2px; bottom: -9px;
    width: 7px; height: 7px; border: 1px solid #3b3d385c; border-radius: 50%;
  }
  .dossie-papel.marca-ordem .dossie-cabecalho { letter-spacing: .055em; }
  .dossie-cabecalho {
    display: grid; grid-template-columns: 1fr auto; gap: 24px;
    padding-bottom: 14px; border-bottom: 1px solid var(--linha-doc);
    font-size: 9px; letter-spacing: .045em; line-height: 1.55;
  }
  .dossie-cabecalho span, .dossie-cabecalho strong { display: block; }
  .dossie-cabecalho > div:first-child > strong { font-size: 10px; }
  .dossie-registro {
    min-width: 112px; padding-left: 18px; border-left: 1px solid var(--linha-doc);
    color: var(--tinta-fraca-doc);
  }
  .dossie-registro strong { margin: 2px 0 4px; color: var(--tinta-doc); font-size: 22px; letter-spacing: .02em; }
  .dossie-fechar {
    all: unset; position: absolute; top: 12px; right: 15px; z-index: 2;
    width: 28px; height: 28px; cursor: pointer; text-align: center;
    color: #5d5547; font-size: 20px; line-height: 28px;
  }
  .dossie-fechar:hover, .dossie-fechar:focus-visible { color: #201d18; outline: 1px solid #756a57; }
  .dossie-corpo { overflow: auto; padding: clamp(18px, 3vh, 30px) 5px 16px 0; scrollbar-color: #827762 transparent; }
  .dossie-setor { margin: 0 0 8px; color: var(--carimbo); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
  .dossie-corpo h1 {
    margin: 0 0 clamp(18px, 3vh, 30px); text-align: center;
    font: 700 clamp(19px, 2.5vw, 27px)/1.2 Georgia, "Times New Roman", serif;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .dossie-corpo h2 {
    margin: 0 0 6px; color: var(--carimbo);
    font-size: 10px; line-height: 1.35; letter-spacing: .08em; text-transform: uppercase;
  }
  .dossie-corpo section { margin: 0 0 20px; }
  .dossie-corpo section p { margin: 0; font-size: clamp(12px, 1.55vw, 14px); line-height: 1.65; white-space: pre-line; }
  .dossie-corpo .dossie-nota {
    margin-top: 24px; padding-top: 12px; border-top: 1px solid rgba(89,79,62,.4);
    color: var(--tinta-fraca-doc);
  }
  .dossie-metadados {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    margin: 0 0 24px; border: 1px solid var(--linha-doc); background: var(--linha-doc);
  }
  .dossie-metadados > div { padding: 10px 12px; background: var(--papel-claro); }
  .dossie-metadados dt { color: var(--tinta-fraca-doc); font-size: 9px; text-transform: uppercase; }
  .dossie-metadados dd { margin: 4px 0 0; font-size: 13px; font-weight: 700; text-transform: uppercase; }
  .dossie-navegacao {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    min-height: 36px; padding-top: 12px; border-top: 1px solid var(--linha-doc);
    color: var(--tinta-fraca-doc); font-size: 10px; letter-spacing: .05em; text-transform: uppercase;
  }
  .dossie-navegacao button {
    all: unset; cursor: pointer; padding: 8px 0; color: var(--tinta-fraca-doc);
  }
  .dossie-navegacao button:first-child { justify-self: start; }
  .dossie-navegacao button:last-child { justify-self: end; text-align: right; }
  .dossie-navegacao button:hover, .dossie-navegacao button:focus-visible { color: var(--tinta-doc); text-decoration: underline; }
  .dossie-carimbo {
    position: absolute; right: 38px; bottom: 62px; padding: 5px 9px;
    border: 2px solid #743c3599; color: #743c3599; transform: rotate(-5deg);
    font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none;
  }
  #relatorio-overlay.modo-dossie.encerrando,
  #relatorio-overlay.modo-dossie.encerrado { background: #050506; backdrop-filter: none; }
  .encerramento-final {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    color: var(--tinta); font-family: "Courier New", ui-monospace, monospace;
    opacity: 0; animation: aparecer-final .8s ease .12s forwards;
  }
  .encerramento-final span { color: var(--tinta-fraca); font-size: 10px; letter-spacing: .28em; }
  .encerramento-final strong { font-size: clamp(18px, 3vw, 28px); letter-spacing: .08em; text-transform: uppercase; }
  .encerramento-final p { margin: 0; color: var(--tinta-fraca); font-size: 12px; }
  @keyframes aparecer-final { to { opacity: 1; } }
  @media (max-width: 620px), (max-height: 620px) {
    .dossie-papel { width: 90vw; height: 78vh; min-height: 340px; padding: 24px 22px 16px; }
    .dossie-cabecalho { gap: 12px; }
    .dossie-registro { min-width: 88px; padding-left: 10px; }
    .dossie-registro strong { font-size: 17px; }
    .dossie-metadados { grid-template-columns: 1fr; }
    .dossie-carimbo { display: none; }
    .dossie-navegacao { gap: 8px; font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #relatorio-overlay, #relatorio-overlay .ficha, .dossie-papel { transition: none; }
    .encerramento-final { animation-duration: .01ms; animation-delay: 0s; }
    canvas.tremor-leve, canvas.tremor-corte { animation: none; }
  }

  /* Diário de Bordo: camada independente do relatório. A abertura usa duas
     folhas reais lado a lado; não compartilha DOM, classes nem estado com o
     dossiê, que continua sendo o documento principal da Sala Final. */
  #diario-overlay {
    position: fixed; inset: 0; z-index: 21;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; padding: clamp(14px, 3vw, 36px);
    background: rgba(4, 4, 5, .76); backdrop-filter: blur(3px) saturate(.68);
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .32s ease, visibility 0s linear .32s;
  }
  #diario-overlay.visivel {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .32s ease;
  }
  .diario-livro {
    --diario-papel: #c8bea3; --diario-papel-claro: #d4cab0;
    --diario-tinta: #302a21; --diario-fraca: #716754; --diario-capa: #42342e;
    position: relative; width: min(1040px, 94vw); height: min(78vh, 700px);
    min-height: 470px; display: grid; grid-template-rows: 1fr auto;
    box-shadow: 0 34px 100px rgba(0,0,0,.82), 0 8px 22px rgba(0,0,0,.58);
    opacity: 0; transform: translateY(12px) scale(.988);
    transition: opacity .28s ease, transform .28s ease;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  .diario-livro.aberto { opacity: 1; transform: none; }
  .diario-abertura {
    position: relative; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--diario-capa); padding: 10px 11px 7px;
  }
  .diario-abertura::after {
    content: ""; position: absolute; z-index: 2; top: 10px; bottom: 7px; left: 50%;
    width: 34px; transform: translateX(-50%); pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(48,38,29,.22) 38%, rgba(255,255,255,.09) 51%, rgba(48,38,29,.24) 65%, transparent);
  }
  .diario-pagina {
    position: relative; min-width: 0; overflow: auto; box-sizing: border-box;
    padding: clamp(32px, 4vw, 54px) clamp(28px, 4vw, 58px) 42px;
    color: var(--diario-tinta); scrollbar-color: #857962 transparent;
    background-color: var(--diario-papel);
    background-image:
      radial-gradient(circle at 16% 12%, #715f3f16 0 1px, transparent 2px),
      radial-gradient(circle at 78% 76%, #62523812 0 1px, transparent 2px),
      repeating-linear-gradient(0deg, transparent 0 3px, #2b241807 3px 4px),
      linear-gradient(96deg, #78684910, transparent 14%, #fff2 52%, transparent 88%);
    border: 1px solid #91866e; box-shadow: inset 0 0 46px rgba(91,73,43,.13);
  }
  .diario-pagina:first-child { border-right: 0; border-radius: 3px 0 0 2px; }
  .diario-pagina:nth-child(2) { border-left: 0; border-radius: 0 3px 2px 0; }
  .diario-pagina header { min-height: 76px; padding-bottom: 15px; border-bottom: 1px solid rgba(91,80,61,.42); }
  .diario-pagina header span {
    display: block; margin-bottom: 7px; color: var(--diario-fraca);
    font: 10px/1.4 "Courier New", ui-monospace, monospace; letter-spacing: .11em; text-transform: uppercase;
  }
  .diario-pagina h2 { margin: 0; font-size: clamp(19px, 2vw, 26px); line-height: 1.15; font-weight: 600; }
  .diario-texto { padding-top: clamp(18px, 2.5vh, 28px); }
  .diario-texto p { margin: 0 0 1em; font-size: clamp(13px, 1.25vw, 15px); line-height: 1.62; }
  .diario-texto blockquote {
    margin: 24px 0 0; padding: 14px 0 2px 18px;
    border-left: 2px solid rgba(102,73,53,.58); color: #4a392d;
    font-size: clamp(14px, 1.35vw, 17px); line-height: 1.55; font-style: italic;
  }
  .diario-pagina > small {
    position: absolute; bottom: 17px; left: 50%; transform: translateX(-50%);
    color: var(--diario-fraca); font: 9px/1 "Courier New", ui-monospace, monospace; letter-spacing: .12em;
  }
  .diario-pagina-final { display: flex; flex-direction: column; justify-content: center; }
